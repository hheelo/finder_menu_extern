name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pinned XcodeGen
        run: |
          ./scripts/install-pinned-xcodegen.sh "${RUNNER_TEMP}/rightclick-xcodegen"
          echo "${RUNNER_TEMP}/rightclick-xcodegen/xcodegen/bin" >> "${GITHUB_PATH}"

      - name: Verify generated project is up to date
        run: ./scripts/verify-generated-project.sh

      - name: Verify localization catalog
        run: ./scripts/verify-localization.sh

      - name: Build and test
        run: |
          xcodebuild \
            -project RightClick.xcodeproj \
            -scheme RightClick \
            -configuration Debug \
            -derivedDataPath .build/CIDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: UI smoke test
        run: |
          xcodebuild -quiet \
            -project RightClick.xcodeproj \
            -scheme RightClickUI \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath .build/CIUIDerivedData \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            test

      - name: Build Universal Release
        run: |
          xcodebuild \
            -project RightClick.xcodeproj \
            -scheme RightClick \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath .build/CIReleaseBuild \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            build
