name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pinned XcodeGen
        run: |
          ./scripts/install-pinned-xcodegen.sh "${RUNNER_TEMP}/rightclick-xcodegen"
          echo "${RUNNER_TEMP}/rightclick-xcodegen/xcodegen/bin" >> "${GITHUB_PATH}"

      - name: Verify generated project is up to date
        run: ./scripts/verify-generated-project.sh

      - name: Verify localization catalog
        run: ./scripts/verify-localization.sh

      - name: Verify release version guard
        run: ./scripts/test-release-version-validation.sh

      - name: Verify validation report generator
        run: ./scripts/test-create-validation-report.sh

      - name: Build and test
        run: |
          mkdir -p .build/CIResults
          xcodebuild \
            -project RightClick.xcodeproj \
            -scheme RightClick \
            -configuration Debug \
            -derivedDataPath .build/CIDerivedData \
            -resultBundlePath .build/CIResults/Logic.xcresult \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            test

      - name: Publish coverage summary
        run: |
          echo '### Logic coverage' >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
          xcrun xccov view --report --only-targets \
            .build/CIResults/Logic.xcresult | tee -a "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"

      - name: Static analysis
        run: |
          xcodebuild -quiet \
            -project RightClick.xcodeproj \
            -scheme RightClick \
            -configuration Debug \
            -derivedDataPath .build/CIAnalyzeDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            analyze

      - name: UI smoke test
        timeout-minutes: 10
        run: |
          xcodebuild -quiet \
            -project RightClick.xcodeproj \
            -scheme RightClickUI \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath .build/CIUIDerivedData \
            -resultBundlePath .build/CIResults/UI.xcresult \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            test

      - name: Build Universal Release
        run: |
          xcodebuild \
            -project RightClick.xcodeproj \
            -scheme RightClick \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath .build/CIReleaseBuild \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Upload test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rightclick-test-results
          path: .build/CIResults/*.xcresult
          if-no-files-found: ignore
          retention-days: 7

  minimum-system:
    name: macOS 14 compatibility
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pinned XcodeGen
        run: |
          ./scripts/install-pinned-xcodegen.sh "${RUNNER_TEMP}/rightclick-xcodegen"
          echo "${RUNNER_TEMP}/rightclick-xcodegen/xcodegen/bin" >> "${GITHUB_PATH}"

      - name: Verify and run logic tests
        run: |
          ./scripts/verify-generated-project.sh
          xcodebuild -quiet \
            -project RightClick.xcodeproj \
            -scheme RightClick \
            -configuration Debug \
            -derivedDataPath .build/MinimumSystemDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            test
