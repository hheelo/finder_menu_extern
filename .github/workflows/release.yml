name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build ad-hoc signed DMG
        env:
          VERSION: ${{ github.ref_name }}
        run: ./scripts/build-release.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            .build/release/output/*.dmg \
            .build/release/output/*.sha256 \
            --generate-notes \
            --title "RightClick ${GITHUB_REF_NAME}"
