name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pinned XcodeGen
        run: |
          ./scripts/install-pinned-xcodegen.sh "${RUNNER_TEMP}/rightclick-xcodegen"
          echo "${RUNNER_TEMP}/rightclick-xcodegen/xcodegen/bin" >> "${GITHUB_PATH}"

      - name: Verify generated project is up to date
        run: ./scripts/verify-generated-project.sh

      - name: Test
        run: |
          xcodebuild \
            -project RightClick.xcodeproj \
            -scheme RightClick \
            -configuration Debug \
            -derivedDataPath .build/CIReleaseTests \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: UI smoke test
        run: |
          xcodebuild -quiet \
            -project RightClick.xcodeproj \
            -scheme RightClickUI \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath .build/CIReleaseUITests \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            test

      - name: Build and verify ad-hoc signed DMG
        env:
          VERSION: ${{ github.ref_name }}
        run: ./scripts/build-release.sh

      - name: Sign update and generate appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ github.ref_name }}
        run: |
          if [ -z "${SPARKLE_PRIVATE_KEY}" ]; then
            echo "缺少 SPARKLE_PRIVATE_KEY，无法签名更新" >&2
            exit 1
          fi
          version="${VERSION#v}"
          build="$(./scripts/derive-build-number.sh "${version}")"
          # 私钥只经标准输入传入，不进命令行参数（同机进程可见）
          printf '%s' "${SPARKLE_PRIVATE_KEY}" | ./scripts/generate-appcast.sh \
            ".build/release/output/RightClick-${version}.dmg" \
            "${version}" \
            "${build}" \
            .build/release/output/appcast.xml

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            .build/release/output/*.dmg \
            .build/release/output/*.sha256 \
            .build/release/output/appcast.xml \
            --generate-notes \
            --title "RightClick ${GITHUB_REF_NAME}"
