name: RightClick

options:
  bundleIdPrefix: com.hheelo
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    # 仅供 Xcode 内直接构建。install.sh、build-release.sh 和 Release CI 都调用
    # derive-build-number.sh 从 MARKETING_VERSION 推导并覆盖该值。
    CURRENT_PROJECT_VERSION: 900
    MARKETING_VERSION: 0.9.0
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: true
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.4

targets:
  RightClickCore:
    type: framework
    platform: macOS
    sources:
      - Sources/RightClickCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hheelo.RightClick.Core
        GENERATE_INFOPLIST_FILE: true
        DEFINES_MODULE: true
        APPLICATION_EXTENSION_API_ONLY: true

  RightClick:
    type: application
    platform: macOS
    sources:
      - Sources/RightClickApp
      - Resources/Assets.xcassets
      - Resources/RightClickApp
    dependencies:
      - target: RightClickCore
        embed: true
      - target: RightClickFinderExtension
        embed: true
      # 只有宿主需要更新能力；扩展沙箱化且由 Finder 加载，不参与更新
      - package: Sparkle
        product: Sparkle
    info:
      path: Configuration/RightClick-Info.plist
      properties:
        CFBundleDisplayName: RightClick
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        # 附属应用：Dock 里不出现图标。宿主主要被扩展的深链唤起，
        # 不应该像普通应用那样占一个 Dock 位置。
        LSUIElement: true
        NSAppleEventsUsageDescription: RightClick 需要控制 Terminal、iTerm2 或 System Events，才能在所选目录的新会话中运行 Codex CLI / Claude Code。
        NSPrincipalClass: NSApplication
        # 始终指向最新一次发布的资产，发新版无需改动此处
        SUFeedURL: https://github.com/hheelo/finder_menu_extern/releases/latest/download/appcast.xml
        SUPublicEDKey: zSS8u0opcEchcZsZKN37gHgs60sOf+c/bOiwyejzX9I=
        # 不做定时检查：宿主经常被深链无声唤起，那种时候弹更新框会很突兀。
        # 只有用户自己打开 App 时才后台查一次，另有手动「检查更新」按钮。
        SUEnableAutomaticChecks: false
        CFBundleURLTypes:
          - CFBundleURLName: com.hheelo.RightClick.command
            CFBundleURLSchemes:
              - rightclick
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hheelo.RightClick
        PRODUCT_NAME: RightClick
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities

  RightClickFinderExtension:
    type: app-extension
    platform: macOS
    sources:
      - Sources/RightClickFinderExtension
    dependencies:
      - target: RightClickCore
        embed: true
    info:
      path: Configuration/RightClickFinderExtension-Info.plist
      properties:
        CFBundleDisplayName: RightClick Finder Extension
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSExtension:
          NSExtensionAttributes: {}
          NSExtensionPointIdentifier: com.apple.FinderSync
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FinderSync
    entitlements:
      path: Configuration/RightClickFinderExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hheelo.RightClick.FinderExtension
        PRODUCT_NAME: RightClickFinderExtension
        CODE_SIGN_ENTITLEMENTS: Configuration/RightClickFinderExtension.entitlements
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true

  RightClickCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/RightClickCoreTests
    dependencies:
      - target: RightClickCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hheelo.RightClick.CoreTests
        GENERATE_INFOPLIST_FILE: true

  RightClickAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/RightClickAppTests
      # 这些测试覆盖纯逻辑，不需要启动 LSUIElement 宿主。直接编译被测文件可以
      # 避开已安装副本的 Bundle ID、Sparkle 和附属应用启动时序干扰。
      - Sources/RightClickApp/ActionExecutor.swift
      - Sources/RightClickApp/AppDiagnostics.swift
      - Sources/RightClickApp/AppLogger.swift
      - Sources/RightClickApp/AppModel.swift
      - Sources/RightClickApp/AppPresentation.swift
      - Sources/RightClickApp/AppVersion.swift
      - Sources/RightClickApp/DeepLinkCoordinator.swift
      - Sources/RightClickApp/DeepLinkRequest.swift
      - Sources/RightClickApp/DiagnosticsStore.swift
      - Sources/RightClickApp/FinderSessionManager.swift
      - Sources/RightClickApp/MenuConfigurationStore.swift
      - Sources/RightClickApp/NonceCache.swift
      - Sources/RightClickApp/TerminalResolver.swift
      - Sources/RightClickApp/UserLoginShell.swift
      - Sources/RightClickApp/UserNotifier.swift
    dependencies:
      - target: RightClickCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hheelo.RightClick.AppTests
        GENERATE_INFOPLIST_FILE: true

schemes:
  RightClick:
    build:
      targets:
        RightClick: all
        RightClickFinderExtension: all
        RightClickCore: all
        RightClickCoreTests: [test]
        RightClickAppTests: [test]
    test:
      targets:
        - RightClickCoreTests
        - RightClickAppTests
